name: CI - E2E Project Generation Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  basic-generation:
    name: Basic Generation - Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: make install-dev

      - name: Run basic project generation test (Unix)
        if: runner.os != 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_ID: ${{ secrets.BOT_ID_TEST }}
          BOT_SLUG: ${{ secrets.BOT_SLUG_TEST }}
        run: |
          chmod +x scripts/project-generation.sh
          bash scripts/project-generation.sh

      - name: Run basic project generation test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_ID: ${{ secrets.BOT_ID_TEST }}
          BOT_SLUG: ${{ secrets.BOT_SLUG_TEST }}
          PYTHONIOENCODING: utf-8
        run: bash scripts/project-generation.sh

      - name: Verify generated project structure (Unix)
        if: runner.os != 'Windows' && always()
        run: |
          if [ -d "test-generated-project/demo" ]; then
            echo "=== Project Structure ==="
            ls -lah test-generated-project/demo/
            echo ""
            echo "=== Critical File Verification ==="
            test -f test-generated-project/demo/build.gradle && echo "[PASS] build.gradle exists"
            test -f test-generated-project/demo/Makefile && echo "[PASS] Makefile exists"
            test -f test-generated-project/demo/Dockerfile && echo "[PASS] Dockerfile exists"
            test -x test-generated-project/demo/gradlew && echo "[PASS] gradlew is executable"
            test -x test-generated-project/demo/format.sh && echo "[PASS] format.sh is executable"
            test -d test-generated-project/demo/src && echo "[PASS] src directory exists"
            test -d test-generated-project/demo/.git && echo "[PASS] git repository initialized"
          else
            echo "[FAIL] Generated project not found at test-generated-project/demo"
            exit 1
          fi

      - name: Verify generated project structure (Windows)
        if: runner.os == 'Windows' && always()
        shell: bash
        run: |
          if [ -d "test-generated-project/demo" ]; then
            echo "=== Project Structure ==="
            ls -lah test-generated-project/demo/
            echo ""
            echo "=== Critical File Verification ==="
            test -f test-generated-project/demo/build.gradle && echo "[PASS] build.gradle exists"
            test -f test-generated-project/demo/Makefile && echo "[PASS] Makefile exists"
            test -f test-generated-project/demo/Dockerfile && echo "[PASS] Dockerfile exists"
            test -f test-generated-project/demo/gradlew && echo "[PASS] gradlew exists"
            test -f test-generated-project/demo/format.sh && echo "[PASS] format.sh exists"
            test -d test-generated-project/demo/src && echo "[PASS] src directory exists"
            test -d test-generated-project/demo/.git && echo "[PASS] git repository initialized"
          else
            echo "[FAIL] Generated project not found at test-generated-project/demo"
            exit 1
          fi

      - name: Test format.sh execution
        if: always()
        shell: bash
        run: |
          if [ -f "test-generated-project/demo/format.sh" ]; then
            echo "=== Testing format.sh execution ==="
            cd test-generated-project/demo
            chmod +x format.sh 2>/dev/null || true

            if ./format.sh; then
              echo "[PASS] format.sh executed successfully"
            else
              echo "[FAIL] format.sh execution failed"
              exit 1
            fi
          else
            echo "[SKIP] format.sh not found"
          fi

      - name: Upload generated project artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basic-generated-project-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-generated-project/
          retention-days: 7
          if-no-files-found: warn

      - name: Clean up test directory
        if: always()
        shell: bash
        run: |
          if [ -d "test-generated-project" ]; then
            rm -rf test-generated-project
            echo "Cleaned up test directory"
          fi

  feature-combinations:
    name: Feature Tests - Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: make install-dev

      - name: Run feature combination tests (Unix)
        if: runner.os != 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_ID: ${{ secrets.BOT_ID_TEST }}
          BOT_SLUG: ${{ secrets.BOT_SLUG_TEST }}
        run: |
          chmod +x scripts/test-feature-combinations.sh
          bash scripts/test-feature-combinations.sh

      - name: Run feature combination tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_ID: ${{ secrets.BOT_ID_TEST }}
          BOT_SLUG: ${{ secrets.BOT_SLUG_TEST }}
          PYTHONIOENCODING: utf-8
        run: bash scripts/test-feature-combinations.sh

      - name: Upload feature test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: feature-test-failures-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-feature-combinations/
          retention-days: 7
          if-no-files-found: ignore

  integration-summary:
    name: Integration Test Summary
    runs-on: ubuntu-latest
    needs: [basic-generation, feature-combinations]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "=== Integration Test Summary ==="
          echo "Basic Generation: ${{ needs.basic-generation.result }}"
          echo "Feature Combinations: ${{ needs.feature-combinations.result }}"

          if [ "${{ needs.basic-generation.result }}" != "success" ] || \
             [ "${{ needs.feature-combinations.result }}" != "success" ]; then
            echo ""
            echo "Some integration tests failed"
            exit 1
          else
            echo ""
            echo "All integration tests passed"
          fi
