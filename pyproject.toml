[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ar-infra-cli"
version = "0.1.2"
description = "Production-ready Spring Boot project generator CLI"
authors = [
    {name = "Abegà Razafindratelo", email = "a.razafindratelo@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["cli", "spring-boot", "generator", "java", "gradle"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Operating System :: OS Independent",
]

dependencies = [
    "typer[all]>=0.21.1",
    "click>=8.3.1",
    "rich>=14.2.0",
    "questionary>=2.1.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "gitpython>=3.1.45",
    "jinja2>=3.1.6",
    "httpx>=0.28.1",
    "requests>=2.32.5",
    "toml>=0.10.2",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.1",
    "pathspec>=0.12.1",
    "pathvalidate>=3.3.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
    "pytest-benchmark>=5.2.3",
    "faker>=39.0.0",
    "freezegun>=1.5.5",
    "ruff>=0.14.11",
    "black>=25.12.0",
    "mypy>=1.19.1",
    "types-toml>=0.10.8.20240310",
    "types-pyyaml>=6.0.12.20250915",
    "types-requests>=2.32.4.20260107",
    "bandit[toml]>=1.9.2",
    "safety>=3.7.0",
    "pip-audit>=2.10.0",
    "coverage[toml]>=7.13.0",
    "pre-commit>=4.5.1",
    "sphinx>=8.2.3",
    "sphinx-rtd-theme",
    "sphinx-autodoc-typehints>=3.6.0",
    "build>=1.4.0",
    "setuptools>=80.9.0",
    "wheel>=0.45.1",
    "twine>=6.2.0",
    "ipython>=9.9.0",
    "lxml>=5.3.0",
    "typing-extensions>=4.12.0",
    "ipdb>=0.13.13",
]

[project.scripts]
ar-infra = "src.ar_infra.cli.main:cli"

[project.urls]
Homepage = "https://github.com/Abega1642/ar-infra-cli"
Repository = "https://github.com/Abega1642/ar-infra-cli"
Issues = "https://github.com/Abega1642/ar-infra-cli/issues"


[tool.setuptools.package-data]
"*" = [
    "cli/resources/*",
    "cli/resources/**/*",
    "**/*.txt",
    "**/*.json",
    "**/*.yaml",
    "**/*.yml",
    "**/*.toml",
    "**/*.j2",
    "**/*.jinja2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
namespaces = false


[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "C",
    "B",
    "UP",
    "N",
    "YTT",
    "S",
    "BLE",
    "FBT",
    "A",
    "COM",
    "C4",
    "DTZ",
    "T10",
    "EM",
    "ISC",
    "ICN",
    "G",
    "PIE",
    "T20",
    "PT",
    "Q",
    "RSE",
    "RET",
    "SIM",
    "TID",
    "TCH",
    "ARG",
    "PTH",
    "ERA",
    "PD",
    "PGH",
    "PL",
    "TRY",
    "NPY",
    "RUF",
]
ignore = [
    "COM812",
    "ISC001",
    "T201",
    "E501",
    "S101",
    "PLR0913",
    "PLR2004",
    "TRY003",
    "EM101",
    "EM102",
    "TRY301",
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
"src/ar_infra/infrastructure/template/github_template_fetcher.py" = ["S104"]
"tests/**/*.py" = [
    "S101",
    "ARG",
    "FBT",
    "PLR2004",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-single-line = false
force-sort-within-sections = false
lines-after-imports = 2

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | \.venv
  | build
  | dist
)/
'''


[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
split_on_trailing_comma = true
known_first_party = ["src"]
skip_gitignore = true
skip = [".git", ".mypy_cache", ".pytest_cache", ".ruff_cache", ".venv", "build", "dist"]
src_paths = ["src", "tests"]


[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
extra_checks = true
check_untyped_defs = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
no_implicit_reexport = true
show_error_codes = true
show_column_numbers = true
pretty = true
color_output = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "src.ar_infra.cli.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "click.*"
ignore_missing_imports = true


[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=0",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]


[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__main__.py",
    "*/conftest.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"


[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests", "scripts"]
skips = ["B101", "B104", "B601", "B603", "B404"]
tests = ["B201", "B301"]

[tool.bandit.assert_used]
skips = ["*/test_*.py", "*/tests/*"]
